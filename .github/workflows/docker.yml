# Builds and pushes multi-arch (amd64/arm64) Docker images to Docker Hub,
# triggered by pushing a semver git tag (no "v" prefix), e.g.:
#   git tag 2.9.0 && git push origin 2.9.0
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  — Docker Hub username
#   DOCKERHUB_TOKEN     — a Docker Hub access token (not your account password)

name: Docker image

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

env:
  IMAGE: xerock/zygarde

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
